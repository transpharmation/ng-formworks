@for (layoutNode of layout; track layoutNode; let i = $index) {
  <div [class.form-flex-item]="isFlexItem" [style.grow]="getFlexAttribute(layoutNode, 'grow')" [style.shrink]="getFlexAttribute(layoutNode, 'shrink')" [style.flex-basis]="getFlexAttribute(layoutNode, 'flex-basis')"
      [style.align-self]="(layoutNode?.options || {})['align-self']" [style.order]="layoutNode?.options?.order" [fxFlex]="layoutNode?.options?.fxFlex" [fxFlexOrder]="layoutNode?.options?.fxFlexOrder" [fxFlexOffset]="layoutNode?.options?.fxFlexOffset" [fxFlexAlign]="layoutNode?.options?.fxFlexAlign">
    @if (showWidget(layoutNode)) {
      <select-framework-widget [dataIndex]="layoutNode?.arrayItem ? (dataIndex || []).concat(i) : (dataIndex || [])" [layoutIndex]="(layoutIndex || []).concat(i)" [layoutNode]="layoutNode"></select-framework-widget>
    }
  </div>
}
